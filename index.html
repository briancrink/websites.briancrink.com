<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Websites | Brian Crink</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 20px 16px;
      transition: background 0.4s, color 0.4s;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    body.light {
      background: #ffffff;
      color: #1a1a1a;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1400px;
      min-height: calc(100vh - 40px);
      min-height: calc(100dvh - 40px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 2.5rem;
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .site-nav-link.portal {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-nav-link.portal {
        animation: none;
      }
    }

    .site-nav {
      margin: 0;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.16rem;
    }

    body.light .site-nav {
      color: #1a1a1a;
    }

    .site-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0;
    }

    .site-nav .portal {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .site-nav .nav-dot {
      color: #ffffff;
      font-weight: 400;
      font-size: 1.0rem;
      line-height: 1;
      letter-spacing: 0;
    }

    body.light .site-nav .nav-dot {
      color: #000000;
    }

    .site-nav-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .site-nav-link:hover {
      opacity: 0.85;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .map-link:hover {
      opacity: 0.85;
    }

    .map-icon {
      width: 3.0rem;
      height: 3.0rem;
      display: block;
    }



    .dev-image {
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 0 0 40px;
      color: #ffffff;
      display: block;
    }

    body.light .dev-image {
      color: #111111;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 15px 0;
      letter-spacing: -0.5px;
    }

    body.light .name {
      color: #1a1a1a;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover {
      opacity: 0.85;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.023);
      border-radius: 9999px;
      padding: 8px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: fit-content;
    }

    body.light .status-pill {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.15);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #1784d1;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.85);
      }
    }

    .status-text-wrapper {
      display: flex;
      align-items: center;
      overflow: visible;
      width: 0;
    }

    .status-text {
      color: #1784d1;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
      white-space: nowrap;
      display: inline-block;
      flex-shrink: 0;
      min-height: 1em;
      line-height: 1;
    }

    .cursor {
      width: 2px;
      height: 1em;
      background-color: #1784d1;
      flex-shrink: 0;
      animation: blink-caret 0.75s step-end infinite;
      animation-delay: 0.1s;
      animation-fill-mode: forwards;
      margin-left: 4px;
    }

    @keyframes blink-caret {
      from, to { opacity: 0; }
      50% { opacity: 1; }
    }

    .toggle-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.3s;
      flex-shrink: 0;
      color: #ffffff;
    }

    .toggle-btn:hover {
      transform: rotate(20deg);
    }

    body.light .toggle-btn {
      color: #1a1a1a;
    }

    .toggle-btn svg {
      width: 28px;
      height: 28px;
      display: block;
    }
  </style>
</head>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    const sunIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>`;
    const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;

    function setToggleIcon() {
      toggleBtn.innerHTML = body.classList.contains('light') ? moonIcon : sunIcon;
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light');
      setToggleIcon();
    });

    toggleBtn.addEventListener('mouseenter', setToggleIcon);
    toggleBtn.addEventListener('mouseleave', setToggleIcon);

    function typeWriter(element, text, speed = 85) {
      return new Promise((resolve) => {
        element.textContent = '';
        let i = 0;
        const interval = setInterval(() => {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
          } else {
            clearInterval(interval);
            resolve();
          }
        }, speed);
      });
    }

    async function startTypewriter() {
      const wrapper = document.querySelector('.status-text-wrapper');
      const statusText = document.querySelector('.status-text');
      if (!wrapper || !statusText) return;

      const fullText = "Planned Development";
      const measurer = document.createElement('span');
      measurer.style.position = 'absolute';
      measurer.style.visibility = 'hidden';
      measurer.style.whiteSpace = 'nowrap';
      measurer.style.font = getComputedStyle(statusText).font;
      measurer.textContent = fullText;
      document.body.appendChild(measurer);
      const textWidth = measurer.offsetWidth;
      document.body.removeChild(measurer);
      wrapper.style.width = `${textWidth + 14}px`;
      await typeWriter(statusText, fullText, 85);
    }

    function restartTypewriter() {
      const statusText = document.querySelector('.status-text');
      if (!statusText) return;
      startTypewriter().then(() => {
        setTimeout(restartTypewriter, 5000);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(restartTypewriter, 300);
    });

    (function monitorCode() {
      const layer = document.getElementById('codeScreen');
      if (!layer) return;

      // The four corners of the monitor's true (curved, tilted) screen,
      // traced directly from the illustration's own line art.
      const TL = [396, 16];
      const TR = [858, 130];
      const BR = [844, 434];
      const BL = [398, 278];

      // Sampled points along the illustration's actual top and bottom screen
      // edges, in order from left to right. These edges bow outward — this
      // is what makes the monitor read as a curved display — while the
      // left/right edges are the near-straight sides of the panel.
      const topEdge = [TL, [439, 21.74], [535, 38.8], [605, 53.79], [638, 61.76], [681.71, 73], [740, 89.91], [811, 112.75], TR];
      const bottomEdge = [BL, [474, 297.73], [513, 308.7], [546, 318.59], [592, 333.54], [634, 348.61], [714, 379.32], [780, 407.7], BR];
      const leftEdgePts = [TL, BL];
      const rightEdgePts = [TR, BR];

      function lerp(a, b, t) {
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      }

      // Builds an arc-length lookup table so a curve made of uneven line
      // segments can still be sampled at a uniform "fraction traveled" t.
      function buildTable(pts) {
        const cum = [0];
        for (let i = 1; i < pts.length; i++) {
          cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        }
        return { pts, cum, total: cum[cum.length - 1] };
      }

      function sample(table, t) {
        const target = Math.max(0, Math.min(1, t)) * table.total;
        const { pts, cum } = table;
        let i = 1;
        while (i < cum.length - 1 && cum[i] < target) i++;
        const segLen = cum[i] - cum[i - 1];
        const segT = segLen > 0 ? (target - cum[i - 1]) / segLen : 0;
        return lerp(pts[i - 1], pts[i], segT);
      }

      const TOP = buildTable(topEdge);
      const BOTTOM = buildTable(bottomEdge);
      const LEFT = buildTable(leftEdgePts);
      const RIGHT = buildTable(rightEdgePts);

      // Coons patch: blends the four real boundary curves so every (u, v)
      // lands exactly on the monitor's true curved, tilted screen surface —
      // rather than approximating it with a flat quad plus a fake bulge.
      function screenUV(u, v) {
        const c0 = sample(TOP, u);
        const c1 = sample(BOTTOM, u);
        const d0 = sample(LEFT, v);
        const d1 = sample(RIGHT, v);
        const x = (1 - v) * c0[0] + v * c1[0] + (1 - u) * d0[0] + u * d1[0]
          - ((1 - u) * (1 - v) * TL[0] + u * (1 - v) * TR[0] + (1 - u) * v * BL[0] + u * v * BR[0]);
        const y = (1 - v) * c0[1] + v * c1[1] + (1 - u) * d0[1] + u * d1[1]
          - ((1 - u) * (1 - v) * TL[1] + u * (1 - v) * TR[1] + (1 - u) * v * BL[1] + u * v * BR[1]);
        return [x, y];
      }

      // Physical (pixel) width of a given scroll row, measured along its
      // actual curve, so indentation and line length read as consistent
      // amounts no matter where the row sits on the curved screen.
      function rowArcLength(v) {
        let len = 0;
        let prev = screenUV(0, v);
        const steps = 16;
        for (let i = 1; i <= steps; i++) {
          const p = screenUV(i / steps, v);
          len += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
          prev = p;
        }
        return len;
      }

      // saturated colors are accents) rather than a muted editor theme.

        { color: '#8338ec', weight: 12 },
        { color: '#ff006e', weight: 10 },
        { color: '#2eb5e8', weight: 8 },
        { color: '#fb923c', weight: 8 }
      ];
      const totalWeight = palette.reduce((s, p) => s + p.weight, 0);

      const rng = (seed => {
        let s = seed;
        return () => {
          s = (s * 16807) % 2147483647;
          return (s - 1) / 2147483646;
        };
      })(42);

      function pickColor() {
        let r = rng() * totalWeight;
        for (const p of palette) {
          if (r < p.weight) return p.color;
          r -= p.weight;
        }
        return palette[0].color;
      }

      const ROW_COUNT = 26;
      const basePad = 20;
      const indentUnit = 16;
      // Cascading indent depth, mimicking nested code blocks.
      const cascade = [0, 0, 1, 2, 2, 1, 0, 0, 1, 2, 3, 3, 2, 1, 0, 0, 1, 1, 0, 2, 3, 2, 1, 0, 0, 1];

      const rows = [];
      for (let i = 0; i < ROW_COUNT; i++) {
        const isBlank = rng() < 0.08;
        rows.push({
          v0: (i / ROW_COUNT) + rng() * 0.012,
          indent: cascade[i % cascade.length],
          length: isBlank ? 0 : 44 + rng() * 190,
          color: pickColor(),
          opacity: 0.6 + rng() * 0.32,
          weight: 1.5 + rng() * 1.1
        });
      }

      function linePath(v, indentLevel, lengthPixels) {
        const arcLen = rowArcLength(v);
        const padPixels = basePad + indentLevel * indentUnit;
        const uPad = padPixels / arcLen;
        const uEnd = Math.min(0.95, uPad + lengthPixels / arcLen);
        if (uEnd <= uPad) return '';
        const steps = 12;
        let d = '';
        for (let i = 0; i <= steps; i++) {
          const u = uPad + (uEnd - uPad) * (i / steps);
          const p = screenUV(u, v);
          d += (i === 0 ? 'M' : 'L') + p[0].toFixed(2) + ' ' + p[1].toFixed(2);
        }
        return d;
      }

      // Smoothly fades rows in/out near the top and bottom of the screen
      // instead of letting them pop abruptly into view.
      function edgeFade(v) {
        const fadeZone = 0.055;
        if (v < fadeZone) return v / fadeZone;
        if (v > 1 - fadeZone) return (1 - v) / fadeZone;
        return 1;
      }

      function paint(offset) {
        let html = '';
        rows.forEach((row) => {
          if (row.length <= 0) return;
          let v = row.v0 + offset;
          v = v - Math.floor(v);
          const fade = edgeFade(v);
          if (fade <= 0.01) return;
          const d = linePath(v, row.indent, row.length);
          if (!d) return;
          const opacity = (row.opacity * fade).toFixed(2);
          html += `<path d="${d}" fill="none" stroke="${row.color}" stroke-opacity="${opacity}" stroke-width="${row.weight.toFixed(2)}" stroke-linecap="round"/>`;
        });
        layer.innerHTML = html;
      }

      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) {
        paint(0.22);
        return;
      }

      let start = null;
      const period = 16000;
      function tick(ts) {
        if (start === null) start = ts;
        const t = ((ts - start) % period) / period;
        paint(t);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
